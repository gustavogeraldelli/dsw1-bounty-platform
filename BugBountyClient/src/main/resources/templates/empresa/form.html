<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <title th:text="${id == null} ? 'Cadastrar Empresa' : 'Editar Empresa'"></title>
</head>
<body>
<section layout:fragment="content">
    <div class="row justify-content-center mt-4">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0" th:text="${id == null} ? 'Registrar Nova Empresa' : 'Editar Dados da Empresa'"></h4>
                </div>
                <div class="card-body">
                    <form th:action="${id == null} ? @{/empresas/cadastrar} : @{/empresas/editar/{id}(id=${id})}" th:object="${empresa}" method="POST">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="nome" class="form-label">Nome da Empresa</label>
                                <input type="text" id="nome" th:field="*{nome}" class="form-control" required/>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="cnpj" class="form-label">CNPJ</label>
                                <input type="text" id="cnpj" th:field="*{cnpj}" class="form-control"
                                       placeholder=00.000.000/0000-00"" required/>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label">E-mail</label>
                                <input type="email" id="email" th:field="*{email}" class="form-control" required/>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="setor" class="form-label">Setor de Atuação</label>
                                <input type="text" id="setor" th:field="*{setor}" class="form-control" required/>
                            </div>
                        </div>

                        <div class="mb-3" th:if="${id == null}">
                            <label for="senha" class="form-label">Senha</label>
                            <input type="password" id="senha" th:field="*{senha}" class="form-control" required/>
                        </div>

                        <div class="mb-3">
                            <label for="descricao" class="form-label"> Descrição da Empresa / Sobre </label>
                            <textarea id="descricao" th:field="*{descricao}" class="form-control" rows="3"
                            placeholder="Ex: Somos uma Fintech focada em microcrédito... (Isso ajudará os pesquisadores a entenderem o seu modelo de negócios)"></textarea>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-3">
                            <a th:href="@{/empresas/listar}" class="btn btn-secondary">Voltar</a>
                            <button type="submit" class="btn btn-success">Salvar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
