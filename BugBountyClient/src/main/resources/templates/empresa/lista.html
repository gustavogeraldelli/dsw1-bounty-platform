<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <title>Empresas</title>
</head>
<body>
<section layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3 mt-4">
        <h2>Empresas</h2>
        <a class="btn btn-primary" th:href="@{/empresas/cadastrar}">Nova Empresa</a>
    </div>

    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>CNPJ</th>
            <th>Nome</th>
            <th>Setor</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="emp : ${empresas}">
            <td th:text="${emp.id}"></td>
            <td th:text="${emp.cnpj}"></td>
            <td th:text="${emp.nome}"></td>
            <td th:text="${emp.setor}"></td>
            <td>
                <div class="d-flex gap-2">
                    <a th:href="@{/empresas/editar/{id}(id=${emp.id})}" class="btn btn-sm btn-primary">Editar</a>
                    <a th:href="@{/empresas/excluir/{id}(id=${emp.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Confirmar exclusão?');">Excluir</a>
                </div>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(empresas)}">
            <td colspan="5" class="text-center text-muted">Nenhuma empresa retornada pela API.</td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
