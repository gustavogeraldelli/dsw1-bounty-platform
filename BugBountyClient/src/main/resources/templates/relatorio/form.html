<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <title>Submeter Relatório</title>
</head>
<body>
<section layout:fragment="content">
    <div class="row justify-content-center mt-4">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">Submeter Prova de Conceito (PoC)</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/relatorios/submeter}" method="POST" enctype="multipart/form-data">

                        <div class="mb-3">
                            <label for="pesquisadorId" class="form-label">Pesquisador</label>
                            <select id="pesquisadorId" name="pesquisadorId" class="form-select" required>
                                <option value="" disabled selected>Selecione o autor...</option>
                                <option th:each="p : ${pesquisadores}" th:value="${p.id}" th:text="${p.nome}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="programaId" class="form-label">Programa</label>
                            <select id="programaId" name="programaId" class="form-select" required>
                                <option value="" disabled selected>Selecione o escopo...</option>
                                <option th:each="prog : ${programas}" th:value="${prog.id}" th:text="${prog.titulo + ' (' + prog.nomeEmpresa + ')'}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="file" class="form-label"> Arquivo de Evidência (PDF, máximo 10MB) </label>
                            <input class="form-control" type="file" id="file" name="file" accept="application/pdf" required>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a th:href="@{/relatorios/listar}" class="btn btn-secondary">Voltar</a>
                            <button type="submit" class="btn btn-success">Enviar Relatório</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
