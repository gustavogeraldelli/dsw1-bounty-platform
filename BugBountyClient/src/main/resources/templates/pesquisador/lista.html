<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <title>Pesquisadores</title>
</head>
<body>
<section layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3 mt-4">
        <h2>Pesquisadores</h2>
        <a class="btn btn-primary" th:href="@{/pesquisadores/cadastrar}">Novo Pesquisador</a>
    </div>

    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>CPF</th>
            <th>Email</th>
            <th>Celular</th>
            <th>Data de Nascimento</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="pesq : ${pesquisadores}">
            <td th:text="${pesq.id}"></td>
            <td th:text="${pesq.nome}"></td>
            <td th:text="${pesq.cpf}"></td>
            <td th:text="${pesq.email}"></td>
            <td th:text="${pesq.telefone()}"></td>
            <td th:text="${#temporals.format(pesq.dataNascimento, 'dd/MM/yyyy')}"></td>
            <td>
                <div class="d-flex gap-2">
                    <a th:href="@{/pesquisadores/editar/{id}(id=${pesq.id})}" class="btn btn-sm btn-primary">Editar</a>
                    <a th:href="@{/pesquisadores/excluir/{id}(id=${pesq.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Confirmar exclusão?');">Excluir</a>
                </div>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(pesquisadores)}">
            <td colspan="7" class="text-center text-muted">Nenhum pesquisador retornado pela API.</td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
