<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <title th:text="#{login.title}"></title>
</head>
<body>
<section layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <h2 class="mb-4 text-center" th:text="#{login.header}"></h2>

            <div th:if="${param.error}" class="alert alert-danger text-center" th:text="#{login.error}"></div>
            <div th:if="${param.logout}" class="alert alert-success text-center" th:text="#{login.logout}"></div>

            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form th:action="@{/login}" method="POST">
                        <div class="mb-3">
                            <label for="username" class="form-label" th:text="#{login.label.email}"></label>
                            <input type="email" class="form-control" id="username" name="username" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label" th:text="#{login.label.password}"></label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mt-3" th:text="#{login.btn.submit}"></button>
                    </form>
                </div>
            </div>

            <div class="text-center mt-3">
                <p>
                    <span th:text="#{login.text.noAccount}"></span>
                    <a th:href="@{/cadastrar}" th:text="#{login.link.register}"></a>
                </p>
            </div>
        </div>
    </div>
</section>
</body>
</html>
