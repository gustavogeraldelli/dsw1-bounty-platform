<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <title th:text="#{empresa.list.title}"></title>
</head>
<body>
<section layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 th:text="#{empresa.list.header}"></h2>
        <a class="btn btn-primary" th:href="@{/empresas/cadastrar}" th:text="#{empresa.list.btn.new}"></a>
    </div>

    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th th:text="#{empresa.list.table.id}"></th>
            <th th:text="#{empresa.list.table.cnpj}"></th>
            <th th:text="#{empresa.list.table.name}"></th>
            <th th:text="#{empresa.list.table.sector}"></th>
            <th th:text="#{empresa.list.table.actions}"></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="empresa : ${empresas}">
            <td th:text="${empresa.id}"></td>
            <td th:text="${empresa.cnpj}"></td>
            <td th:text="${empresa.nome}"></td>
            <td th:text="${empresa.setor}"></td>
            <td>
                <a class="btn btn-sm btn-primary" th:href="@{/empresas/editar/{id}(id=${empresa.id})}" th:text="#{empresa.list.btn.edit}"></a>

                <a th:if="${#lists.isEmpty(empresa.programas)}"
                   class="btn btn-sm btn-danger"
                   th:href="@{/empresas/excluir/{id}(id=${empresa.id})}"
                   th:data-confirm="#{empresa.list.confirm.delete}"
                   onclick="return confirm(this.getAttribute('data-confirm'));"
                   th:text="#{empresa.list.btn.delete}"></a>

                <button th:unless="${#lists.isEmpty(empresa.programas)}"
                        class="btn btn-sm btn-secondary"
                        disabled
                        th:title="#{empresa.list.blocked}"
                        th:text="#{empresa.list.btn.delete}"></button>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(empresas)}">
            <td colspan="5" class="text-center" th:text="#{empresa.list.table.empty}"></td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
