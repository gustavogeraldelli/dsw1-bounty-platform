<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <title>Lista de Empresas</title>
</head>
<body>
<section layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Empresas</h2>
        <a class="btn btn-primary" th:href="@{/empresas/cadastrar}">Nova Empresa</a>
    </div>

    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>CNPJ</th>
            <th>Nome</th>
            <th>Setor</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="empresa : ${empresas}">
            <td th:text="${empresa.id}"></td>
            <td th:text="${empresa.cnpj}"></td>
            <td th:text="${empresa.nome}"></td>
            <td th:text="${empresa.setor}"></td>
            <td>
                <a class="btn btn-sm btn-primary" th:href="@{/empresas/editar/{id}(id=${empresa.id})}">Editar</a>

                <a th:if="${#lists.isEmpty(empresa.programas)}"
                   class="btn btn-sm btn-danger"
                   th:href="@{/empresas/excluir/{id}(id=${empresa.id})}"
                   onclick="return confirm('Tem certeza que deseja excluir esta empresa?');">Excluir</a>

                <button th:unless="${#lists.isEmpty(empresa.programas)}"
                        class="btn btn-sm btn-secondary"
                        disabled
                        title="Bloqueado: Esta empresa possui programas ativos.">Excluir</button>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(empresas)}">
            <td colspan="5" class="text-center">Nenhuma empresa cadastrada.</td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
