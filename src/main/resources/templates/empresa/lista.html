<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <title>Lista de Empresas</title>
</head>
<body>
<section layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Empresas Cadastradas</h2>
        <a class="btn btn-primary" th:href="@{/empresas/cadastrar}">Nova Empresa</a>
    </div>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>CNPJ</th>
            <th>Nome</th>
            <th>Setor</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="empresa : ${empresas}">
            <td th:text="${empresa.id}"></td>
            <td th:text="${empresa.cnpj}"></td>
            <td th:text="${empresa.nome}"></td>
            <td th:text="${empresa.setor}"></td>
            <td>
                <a class="btn btn-sm btn-warning" th:href="@{/empresas/editar/{id}(id=${empresa.id})}">Editar</a>
                <a class="btn btn-sm btn-danger" th:href="@{/empresas/excluir/{id}(id=${empresa.id})}"
                   onclick="return confirm('Tem certeza que deseja excluir?');">Excluir</a>
            </td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
