<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <title>Submeter Relatório</title>
</head>
<body>
<section layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">Submeter Prova de Conceito (PoC)</h4>
                </div>
                <div class="card-body">

                    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <span th:text="${erro}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <form th:action="@{/relatorios/cadastrar}" method="POST" enctype="multipart/form-data">

                        <div class="mb-4 bg-light p-3 rounded border">
                            <h6 class="text-muted mb-1">Programa Alvo:</h6>
                            <h5 class="mb-0 text-dark" th:text="${programa.titulo + ' - ' + programa.empresa.nome}"></h5>
                        </div>

                        <input type="hidden" name="programaId" th:value="${programa.id}" />

                        <div class="mb-4">
                            <label for="file" class="form-label">Arquivo de Evidência (PDF, máximo 10MB)</label>
                            <input type="file" id="file" name="file" class="form-control" accept="application/pdf" required />
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/programas/detalhes/{id}(id=${programa.id})}" class="btn btn-secondary">Voltar</a>
                            <button type="submit" class="btn btn-success">Enviar Relatório</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
