<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <title>Lista de Relatórios</title>
</head>
<body>
<section layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Relatórios Submetidos (PoCs)</h2>
        <a class="btn btn-primary" th:href="@{/relatorios/cadastrar}">Submeter Novo Relatório</a>
    </div>

    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Pesquisador</th>
            <th>Programa</th>
            <th>Empresa</th>
            <th>Data de Submissão</th>
            <th>Status</th>
            <th>Arquivo</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="relatorio : ${relatorios}">
            <td th:text="${relatorio.id}"></td>
            <td th:text="${relatorio.pesquisador.nome}"></td>
            <td th:text="${relatorio.programa.titulo}"></td>
            <td th:text="${relatorio.programa.empresa.nome}"></td>

            <td th:text="${#temporals.format(relatorio.dataSubmissao, 'dd/MM/yyyy HH:mm')}"></td>

            <td>
                <span class="badge bg-warning text-dark" th:if="${relatorio.status.name() == 'EM_TRIAGEM'}">Em Triagem</span>
                <span class="badge bg-danger" th:if="${relatorio.status.name() == 'VULNERAVEL'}">Vulnerável</span>
                <span class="badge bg-secondary" th:if="${relatorio.status.name() == 'REJEITADO'}">Rejeitado</span>
                <span class="badge bg-info" th:if="${relatorio.status.name() == 'DUPLICADO'}">Duplicado</span>
                <!-- escolher status -->
                <div class="mt-2" th:if="${relatorio.status.name() == 'EM_TRIAGEM'}">
                    <form th:action="@{/relatorios/avaliar}" method="POST" class="d-inline">
                        <input type="hidden" name="id" th:value="${relatorio.id}" />
                        <input type="hidden" name="status" value="VULNERAVEL" />
                        <button type="submit" class="btn btn-sm btn-success mb-1">Aceitar</button>
                    </form>
                    <form th:action="@{/relatorios/avaliar}" method="POST" class="d-inline">
                        <input type="hidden" name="id" th:value="${relatorio.id}" />
                        <input type="hidden" name="status" value="REJEITADO" />
                        <button type="submit" class="btn btn-sm btn-danger mb-1">Rejeitar</button>
                    </form>
                    <form th:action="@{/relatorios/avaliar}" method="POST" class="d-inline">
                        <input type="hidden" name="id" th:value="${relatorio.id}" />
                        <input type="hidden" name="status" value="DUPLICADO" />
                        <button type="submit" class="btn btn-sm btn-secondary mb-1">Duplicado</button>
                    </form>
                </div>
            </td>

            <td>
                <span th:text="${relatorio.caminhoArquivoPoc}"></span>
            </td>

            <td>
                <a th:href="@{/{caminho}(caminho=${relatorio.caminhoArquivoPoc})}" target="_blank">Ver PoC</a>
                <hr class="my-2 border-secondary">
                <a class="btn btn-sm btn-outline-danger"
                   th:href="@{/relatorios/excluir/{id}(id=${relatorio.id})}"
                   onclick="return confirm('ATENÇÃO: Tem certeza que deseja excluir este relatório permanentemente do sistema? Esta é uma ação administrativa.');">
                    Excluir
                </a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(relatorios)}">
            <td colspan="7" class="text-center">Nenhum relatório submetido até o momento.</td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
