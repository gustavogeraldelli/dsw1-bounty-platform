<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <title>Submeter Relatório</title>
</head>
<body>
<section layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">Submeter Prova de Conceito (PoC)</h4>
                </div>
                <div class="card-body">

                    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <span th:text="${erro}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <form th:action="@{/relatorios/salvar}" method="POST" enctype="multipart/form-data">

                        <div class="mb-3">
                            <label for="pesquisador" class="form-label">Pesquisador Responsável</label>
                            <select id="pesquisador" name="pesquisadorId" class="form-select" required>
                                <option value="">Selecione o Pesquisador...</option>
                                <option th:each="p : ${pesquisadores}"
                                        th:value="${p.id}"
                                        th:text="${p.nome + ' (' + p.cpf + ')'}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="programa" class="form-label">Programa Alvo</label>
                            <select id="programa" name="programaId" class="form-select" required>
                                <option value="">Selecione o Programa...</option>
                                <option th:each="prog : ${programas}"
                                        th:value="${prog.id}"
                                        th:text="${prog.titulo + ' - ' + prog.empresa.nome}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="file" class="form-label">Arquivo de Evidência (PDF, máximo 10MB)</label>
                            <input type="file" id="file" name="file" class="form-control" accept="application/pdf" required />
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/relatorios/listar}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Enviar Relatório</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
