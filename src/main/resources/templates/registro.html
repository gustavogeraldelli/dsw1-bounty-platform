<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <title>Cadastrar Pesquisador</title>
</head>
<body>
<section layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">Cadastrar Novo Pesquisador</h4>
                </div>
                <div class="card-body">

                    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <span th:text="${erro}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <form th:action="@{/cadastrar}" th:object="${pesquisador}" method="POST">
                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label for="nome" class="form-label">Nome Completo</label>
                                <input type="text" id="nome" th:field="*{nome}" class="form-control" required />
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="cpf" class="form-label">CPF</label>
                                <input type="text" id="cpf" th:field="*{cpf}" class="form-control cpf" required />
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label">E-mail</label>
                                <input type="email" id="email" th:field="*{email}" class="form-control" required />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="telefone" class="form-label">Celular / Telefone</label>
                                <input type="text" id="telefone" th:field="*{telefone}" class="form-control telefone" required />
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="senha" class="form-label">Senha</label>
                            <input type="password" id="senha" th:field="*{senha}" class="form-control" required />
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="dataNascimento" class="form-label">Data de Nascimento</label>
                                <input type="date" id="dataNascimento" name="dataNascimento" class="form-control" required />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="sexo" class="form-label">Sexo</label>
                                <select id="sexo" th:field="*{sexo}" class="form-select" required>
                                    <option value="">Selecione...</option>
                                    <option value="M">Masculino</option>
                                    <option value="F">Feminino</option>
                                    <option value="O">Outro / Prefiro não dizer</option>
                                </select>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/login}" class="btn btn-secondary">Voltar</a>
                            <button type="submit" class="btn btn-success">Finalizar Cadastro</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
