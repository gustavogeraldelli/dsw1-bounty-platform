<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <title th:text="#{pesquisador.form.title.new}"></title>
</head>
<body>
<section layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0" th:text="#{pesquisador.form.header.new}"></h4>
                </div>
                <div class="card-body">
                    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <span th:text="${erro}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <form th:action="@{/cadastrar}" th:object="${pesquisador}" method="POST">
                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label for="nome" class="form-label" th:text="#{pesquisador.form.label.name}"></label>
                                <input type="text" id="nome" th:field="*{nome}" class="form-control" th:errorclass="is-invalid" required />
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="cpf" class="form-label" th:text="#{pesquisador.form.label.cpf}"></label>
                                <input type="text" id="cpf" th:field="*{cpf}" class="form-control cpf" th:errorclass="is-invalid" required th:placeholder="#{pesquisador.form.placeholder.cpf}" />
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label" th:text="#{pesquisador.form.label.email}"></label>
                                <input type="email" id="email" th:field="*{email}" class="form-control" th:errorclass="is-invalid" required />
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="telefone" class="form-label" th:text="#{pesquisador.form.label.phone}"></label>
                                <input type="text" id="telefone" th:field="*{telefone}" class="form-control telefone" th:errorclass="is-invalid" required th:placeholder="#{pesquisador.form.placeholder.phone}" />
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="senha" class="form-label" th:text="#{pesquisador.form.label.password}"></label>
                            <input type="password" id="senha" th:field="*{senha}" class="form-control" required />
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="dataNascimento" class="form-label" th:text="#{pesquisador.form.label.birthdate}"></label>
                                <input type="date" id="dataNascimento" name="dataNascimento" class="form-control" required />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="sexo" class="form-label" th:text="#{pesquisador.form.label.gender}"></label>
                                <select id="sexo" th:field="*{sexo}" class="form-select" required>
                                    <option value="" th:text="#{pesquisador.form.gender.select}"></option>
                                    <option value="M" th:text="#{pesquisador.form.gender.m}"></option>
                                    <option value="F" th:text="#{pesquisador.form.gender.f}"></option>
                                    <option value="O" th:text="#{pesquisador.form.gender.o}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/login}" class="btn btn-secondary" th:text="#{pesquisador.form.btn.back}"></a>
                            <button type="submit" class="btn btn-success" th:text="#{pesquisador.form.btn.register}"></button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
