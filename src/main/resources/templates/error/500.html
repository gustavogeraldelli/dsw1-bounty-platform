<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <title>Erro Interno (500)</title>
</head>
<body>
<section layout:fragment="content">
    <div class="row justify-content-center mt-5">
        <div class="col-md-8 text-center">
            <h1 class="display-1 fw-bold text-danger">500</h1>
            <h2 class="mb-3">Erro Interno do Servidor</h2>
            <p class="text-muted mb-4">Ocorreu uma falha inesperada durante o processamento da requisição.</p>

            <div class="card text-start bg-light mb-4" th:if="${message}">
                <div class="card-body p-3 font-monospace" style="font-size: 10pt; white-space: pre-wrap;">
                    <strong>Detalhes do erro:</strong> <span th:text="${message}">Mensagem da exceção</span>
                </div>
            </div>

            <a th:href="@{/}" class="btn btn-secondary">Voltar para o Início</a>
        </div>
    </div>
</section>
</body>
</html>
