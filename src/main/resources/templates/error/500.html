<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <title th:text="#{error.500.title}"></title>
</head>
<body>
<section layout:fragment="content">
    <div class="row justify-content-center mt-5">
        <div class="col-md-8 text-center">
            <h1 class="display-1 fw-bold text-danger">500</h1>
            <h2 class="mb-3" th:text="#{error.500.header}"></h2>
            <p class="text-muted mb-4" th:text="#{error.500.message}"></p>

            <div class="card text-start bg-light mb-4" th:if="${message}">
                <div class="card-body p-3 font-monospace" style="font-size: 10pt; white-space: pre-wrap;">
                    <strong th:text="#{error.500.details}"></strong> <span th:text="${message}"></span>
                </div>
            </div>

            <a th:href="@{/}" class="btn btn-secondary" th:text="#{error.btn.home}"></a>
        </div>
    </div>
</section>
</body>
</html>
