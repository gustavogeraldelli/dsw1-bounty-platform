<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <title th:text="#{error.404.title}"></title>
</head>
<body>
<section layout:fragment="content">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6 text-center">
            <h1 class="display-1 fw-bold text-secondary">404</h1>
            <h2 class="mb-3" th:text="#{error.404.header}"></h2>
            <p class="text-muted mb-4" th:text="#{error.404.message}"></p>
            <a th:href="@{/}" class="btn btn-primary" th:text="#{error.btn.home}"></a>
        </div>
    </div>
</section>
</body>
</html>
