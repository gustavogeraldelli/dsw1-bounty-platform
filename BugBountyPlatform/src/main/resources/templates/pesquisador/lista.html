<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <title th:text="#{pesquisador.list.title}"></title>
</head>
<body>
<section layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 th:text="#{pesquisador.list.header}"></h2>
    </div>

    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th th:text="#{pesquisador.list.table.id}"></th>
            <th th:text="#{pesquisador.list.table.name}"></th>
            <th th:text="#{pesquisador.list.table.cpf}"></th>
            <th th:text="#{pesquisador.list.table.email}"></th>
            <th th:text="#{pesquisador.list.table.phone}"></th>
            <th th:text="#{pesquisador.form.label.birthdate}"></th>
            <th th:text="#{pesquisador.list.table.actions}"></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="pesquisador : ${pesquisadores}">
            <td th:text="${pesquisador.id}"></td>
            <td th:text="${pesquisador.nome}"></td>
            <td th:text="${pesquisador.cpf}"></td>
            <td th:text="${pesquisador.email}"></td>
            <td th:text="${pesquisador.telefone}"></td>
            <td th:text="${#temporals.format(pesquisador.dataNascimento, 'dd/MM/yyyy')}"></td>
            <td>
                <a class="btn btn-sm btn-primary" th:href="@{/pesquisadores/editar/{id}(id=${pesquisador.id})}" th:text="#{pesquisador.list.btn.edit}"></a>

                <a th:if="${#lists.isEmpty(pesquisador.relatorios)}"
                   class="btn btn-sm btn-danger"
                   th:href="@{/pesquisadores/excluir/{id}(id=${pesquisador.id})}"
                   th:data-confirm="#{pesquisador.list.confirm.delete}"
                   onclick="return confirm(this.getAttribute('data-confirm'));"
                   th:text="#{pesquisador.list.btn.delete}"></a>

                <button th:unless="${#lists.isEmpty(pesquisador.relatorios)}"
                        class="btn btn-sm btn-secondary"
                        disabled
                        th:title="#{pesquisador.list.blocked}"
                        th:text="#{pesquisador.list.btn.delete}"></button>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(pesquisadores)}">
            <td colspan="6" class="text-center" th:text="#{pesquisador.list.table.empty}"></td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
